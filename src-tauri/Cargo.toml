[package]
name = "typewriter-plan"
version = "0.1.0"
description = "Minimal study-plan checklist that saves to your Obsidian vault"
edition = "2021"

[lib]
name = "typewriter_plan_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
