<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Typewriter Plan</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="app">
      <!-- Plan card -->
      <div class="board">
        <div class="board-title" data-tauri-drag-region>
          <span id="ptitle">Today's plan</span>
          <span id="prog">0 / 0</span>
        </div>
        <ul id="tasks"></ul>
      </div>

      <!-- Pixel Kirby (drag handle; right-click for the quit menu) -->
      <div class="pet" id="pet" title="Drag to move · right-click to quit" data-tauri-drag-region></div>

      <!-- Quit menu shown on right-click -->
      <div id="petmenu" class="petmenu" hidden>
        <button id="quit" class="petmenu-item">Quit Kirby</button>
      </div>
    </div>
    <script type="module" src="main.js"></script>
  </body>
</html>
